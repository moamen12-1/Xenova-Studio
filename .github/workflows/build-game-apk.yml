name: Build Shadow House Escape APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Shadow House Escape
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل ملفات المشروع من GitHub
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. استخراج مشروع اللعبة
      - name: Extract Game Project
        run: |
          mkdir -p project
          unzip -q "Shadow-House-Escape.zip" -d project

      # 3. إعداد Java
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # 4. إعداد Gradle
      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 5. البحث عن مشروع Android الحقيقي
      - name: Find Android Project
        shell: bash
        run: |
          PROJECT_DIR=$(find project -type f \( \
            -name "settings.gradle.kts" -o \
            -name "settings.gradle" \
          \) -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project was not found."
            echo "The ZIP must contain a native Android project."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "======================================"
          echo "Android project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

      # 6. التأكد من وجود تطبيق app
      - name: Check Android App Module
        shell: bash
        run: |
          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module was not found."
            echo "Expected: app/"
            exit 1
          fi

          echo "Android app module found successfully."

      # 7. إنشاء Debug Keystore تلقائيًا
      - name: Create Debug Keystore
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "Debug keystore created successfully."

      # 8. التحقق من Gradle
      - name: Check Gradle
        run: |
          gradle --version

      # 9. بناء APK للعبة
      - name: Build Shadow House Escape APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      # 10. البحث عن APK
      - name: Find Generated APK
        shell: bash
        run: |
          mkdir -p output

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "======================================"
            echo "ERROR: APK was not generated."
            echo "======================================"

            find "$PROJECT_DIR/app/build" \
              -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print 2>/dev/null || true

            exit 1
          fi

          echo "======================================"
          echo "APK FOUND:"
          echo "$APK"
          echo "======================================"

          cp "$APK" "output/Shadow-House-Escape.apk"

      # 11. رفع APK إلى GitHub Actions
      - name: Upload Shadow House Escape APK
        uses: actions/upload-artifact@v4
        with:
          name: SHADOW-HOUSE-ESCAPE-APK
          path: output/Shadow-House-Escape.apk
          if-no-files-found: error

      # 12. معلومات النهاية
      - name: Build Complete
        run: |
          echo "======================================"
          echo "SHADOW HOUSE ESCAPE BUILD COMPLETE"
          echo "======================================"
          echo "APK: Shadow-House-Escape.apk"
          echo "======================================"
