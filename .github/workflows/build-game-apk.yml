name: Build Shadow House Escape APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Game Project
        run: |
          mkdir -p project
          unzip -q "shadow-house_-escape.zip" -d project

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Find Android Project
        run: |
          PROJECT_DIR=$(find project -type f \( -name "settings.gradle.kts" -o -name "settings.gradle" \) -print -quit | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project found: $PROJECT_DIR"

      - name: Create Debug Keystore
        run: |
          keytool -genkeypair \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -keypass android \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: |
          mkdir -p output

          APK=$(find "$PROJECT_DIR" -type f -name "app-debug.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK was not generated"
            exit 1
          fi

          cp "$APK" output/Shadow-House-Escape.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-House-Escape-APK
          path: output/Shadow-House-Escape.apk
